name: Desktop Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            artifact: markdown-viewer-macos-universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: markdown-viewer-windows-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - run: npm ci

      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          # GitHub caps this at the repository/organization retention setting.
          retention-days: ${{ github.event.repository.private && 400 || 90 }}

  cleanup:
    name: Keep latest installer pair
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: desktop-artifact-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v9
        env:
          BUILD_SUCCEEDED: ${{ needs.build.result == 'success' }}
        with:
          script: |
            const names = [
              'markdown-viewer-macos-universal',
              'markdown-viewer-windows-x64'
            ];
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId
            });
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, per_page: 100 }
            );
            const runs = new Map([[context.runId, currentRun]]);
            const candidates = [];
            for (const artifact of artifacts) {
              if (artifact.expired || !names.includes(artifact.name)) continue;
              const runId = artifact.workflow_run?.id;
              if (!runId) continue;
              if (!runs.has(runId)) {
                const { data } = await github.rest.actions.getWorkflowRun({
                  ...context.repo,
                  run_id: runId
                });
                runs.set(runId, data);
              }
              const run = runs.get(runId);
              if (run.workflow_id !== currentRun.workflow_id) continue;
              // Another run may still be uploading its installers.
              if (runId !== context.runId && run.status !== 'completed') continue;
              candidates.push(artifact);
            }

            const pairs = new Map();
            for (const artifact of candidates) {
              const runId = artifact.workflow_run.id;
              if (runId === context.runId && process.env.BUILD_SUCCEEDED !== 'true') continue;
              if (!pairs.has(runId)) pairs.set(runId, new Map());
              const pair = pairs.get(runId);
              if (!pair.has(artifact.name) || artifact.id > pair.get(artifact.name).id) {
                pair.set(artifact.name, artifact);
              }
            }
            let latest = [...pairs.entries()]
              .filter(([, pair]) => names.every((name) => pair.has(name)))
              .sort(([a], [b]) => b - a)[0];
            if (!latest) {
              // Before the first complete build, retain at most one upload per platform.
              const partial = new Map();
              for (const artifact of [...candidates].sort((a, b) =>
                b.workflow_run.id - a.workflow_run.id || b.id - a.id
              )) {
                if (!partial.has(artifact.name)) partial.set(artifact.name, artifact);
              }
              latest = [null, partial];
            }
            const keep = new Set([...latest[1].values()].map((artifact) => artifact.id));
            for (const artifact of candidates) {
              if (keep.has(artifact.id)) continue;
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id
              });
            }
            core.info(`Kept ${keep.size} desktop installer artifacts${latest[0] ? ` from build ${latest[0]}` : ''}.`);
