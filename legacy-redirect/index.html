<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer has moved</title>
    <link rel="canonical" href="https://md.lunarping.com/" />
    <script>
      const destination = new URL('https://md.lunarping.com/');
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <meta http-equiv="refresh" content="0;url=https://md.lunarping.com/" />
  </head>
  <body>
    <p>
      Markdown Viewer by LunarPing has moved to
      <a href="https://md.lunarping.com/">md.lunarping.com</a>.
    </p>
  </body>
</html>
